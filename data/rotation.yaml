# Nutrient-variety rotation: generic vegetable/food families, no personal data.
weeks:
  1: [leeks, carrots, chard, mushrooms]
  2: [collards or turnip greens, fennel, radicchio or endive, "sweet potato (cooked then chilled)"]
  3: ["Jerusalem artichoke (small portion)", red cabbage or sauerkraut, celery root or parsnip, spinach]
  4: [beets with greens, bok choy, shallots and garlic, "potato (cooked then chilled)", a new mushroom]
every_week:
  - broccoli
  - winter squash
  - item: okra or zucchini
    seasonal: true   # in season only
  - lettuce and arugula
  - a legume
# Months (1-12) when `seasonal: true` items go on the list. Ranges like "4-10", lists like
# "5,6,7", or wrapping ranges like "11-2". Default if omitted: 4-10 (Charleston, SC: zucchini
# from about April, okra through October). Edit to override.
seasonal_months: "4-10"
